<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahi Tīmatanga</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =================== FDMC palette =================== */
  :root {
    --navy: #0b1433; --blue: #1f4fa8; --red: #c8102e; --gold: #f2c80f; --gold-soft: #fbeeb0;
    --cream: #fbf8ef; --ink: #142042; --green: #2e9e5b;
  }
  /* ---------- Option A: Ngahere (forest green & cream) ---------- */
  body.theme-a {
    --bg: #f3f7ea; --text: #17301d; --instr: #1b5e20;
    --banner-bg: linear-gradient(#2e7d32, #1b5e20); --banner-fg: var(--gold); --banner-sub: #fff; --banner-shadow: var(--red);
    --accent1: #43a047; --accent2: #1b5e20; --card-border: #d9e4c9;
    --timer-bg: #1b5e20; --timer-label: var(--gold); --ring: var(--gold); --start-bg: var(--gold); --start-fg: #1b5e20;
    --band-bg: #1b5e20; --band-k1: #fff; --band-k2: var(--red); --band-top: var(--gold);
    --corner: #2e7d32; --corner-op: .13;
    --prayer: #2e7d32;
  }
  /* ---------- Option B: FDMC navy with green ---------- */
  body.theme-b {
    --bg: var(--cream); --text: var(--ink); --instr: var(--navy);
    --banner-bg: var(--navy); --banner-fg: var(--gold); --banner-sub: #fff; --banner-shadow: #2e9e5b;
    --accent1: #2e9e5b; --accent2: #1b5e20; --card-border: #e6dfc8;
    --timer-bg: #1e7a46; --timer-label: var(--gold); --ring: var(--gold); --start-bg: var(--navy); --start-fg: #fff;
    --band-bg: var(--navy); --band-k1: #fff; --band-k2: #2e9e5b; --band-top: var(--gold);
    --corner: #2e9e5b; --corner-op: .12;
    --prayer: var(--navy);
  }
  /* ---------- Option C: Kākāriki (bold green board) ---------- */
  body.theme-c {
    --bg: radial-gradient(ellipse at 50% 0%, #237a43 0%, #145a2f 55%, #0d3f21 100%); --text: var(--ink); --instr: #fff;
    --banner-bg: transparent; --banner-fg: var(--gold); --banner-sub: #fff; --banner-shadow: transparent;
    --accent1: var(--gold); --accent2: var(--red); --card-border: transparent;
    --timer-bg: var(--navy); --timer-label: var(--gold); --ring: #4ade80; --start-bg: #2e9e5b; --start-fg: #fff;
    --band-bg: var(--navy); --band-k1: var(--gold); --band-k2: var(--red); --band-top: var(--gold);
    --corner: #a7f3c0; --corner-op: .10;
    --prayer: var(--gold);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "Nunito Sans", "Segoe UI", Calibri, Arial, sans-serif; color: var(--text); background: var(--bg); }

  /* Everything is sized in vw so it scales with the add-in box (designed for a full 16:9 slide) */
  #app { outline: none; cursor: pointer; position: relative; height: 100%; display: flex; flex-direction: column; padding: 0 2.2vw 0; }

  /* Faint koru in the background corners */
  .corner { position: absolute; bottom: 1vw; width: 22vw; height: 22vw; opacity: var(--corner-op); pointer-events: none; stroke: var(--corner); }
  .corner.l { left: -3vw; } .corner.r { right: -3vw; transform: scaleX(-1); }
  #app::before { left: -3vw; bottom: 1vw; }
  #app::after { right: -3vw; bottom: 1vw; transform: scaleX(-1); }

  /* Layout order (lets each design place the prayer differently) */
  header { order: 1; } #prayer { order: 2; } #grid { order: 4; } .band { order: 5; }

  /* =================== Prayer =================== */
  #prayer { color: var(--prayer); text-align: center; font-style: italic; font-weight: 600; font-size: 1.25vw; letter-spacing: .02em; z-index: 1; }
  #prayer .x { font-style: normal; margin: 0 0.6vw; }
  body.theme-a #prayer { margin-top: 0.2vw; }
  body.theme-b #prayer { position: absolute; bottom: 0.55vw; left: 50%; transform: translateX(-50%); background: var(--cream); border: 0.2vw solid var(--gold); border-radius: 2vw; padding: 0.15vw 1.6vw; white-space: nowrap; font-size: 1.1vw; z-index: 3; }
  body.theme-c #prayer { order: 0; margin: 0 -2.2vw; padding: 0.45vw 0; background: rgba(0,0,0,.28); border-bottom: 0.15vw solid rgba(242,200,15,.5); font-size: 1.1vw; }
  body.theme-c header { padding-top: 0.6vw; }
  body.theme-c .banner { padding-top: 0.2vw; padding-bottom: 0.2vw; }
  body.theme-c .banner h1 { font-size: 4vw; text-shadow: 0 0.3vw 0 rgba(0,0,0,.3); }
  body.theme-c .card { box-shadow: 0 0.4vw 1.2vw rgba(0,0,0,.3); }
  body.theme-c .card.empty { border-color: rgba(255,255,255,.35); color: rgba(255,255,255,.7); }
  body.theme-c #crest { top: 0.4vw; }

  /* =================== Header =================== */
  header { position: relative; display: flex; align-items: center; justify-content: center; gap: 1.6vw; padding: 1.3vw 0 0.6vw; z-index: 1; }
  #crest { position: absolute; left: 0; top: 1vw; height: 6.4vw; }
  .banner { position: relative; background: var(--banner-bg); color: var(--banner-fg); padding: 0.7vw 4.6vw 0.8vw; border-radius: 3vw; text-align: center; box-shadow: 0 0.3vw 0 var(--banner-shadow), 0 0.6vw 1.2vw rgba(11,20,51,.25); }
  .banner h1 { margin: 0; font-family: Montserrat, "Segoe UI", sans-serif; font-weight: 800; font-size: 3.5vw; letter-spacing: .08em; line-height: 1.05; }
  .banner .sub { font-family: Montserrat, "Segoe UI", sans-serif; font-weight: 700; color: var(--banner-sub); font-size: 1.15vw; letter-spacing: .35em; text-transform: uppercase; }
  .koru { color: var(--banner-fg); position: absolute; top: 50%; width: 3.6vw; height: 3.6vw; transform: translateY(-50%); }
  .koru.l { left: 0.6vw; } .koru.r { right: 0.6vw; transform: translateY(-50%) scaleX(-1); }

  /* =================== Cards =================== */
  #grid { margin-top: 0.8vw; flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 1.3vw; min-height: 0; z-index: 1; padding-bottom: 1vw; }
  .card { position: relative; background: #fff; border-radius: 1.2vw; border: 0.15vw solid var(--card-border); box-shadow: 0 0.25vw 0.8vw rgba(11,20,51,.08); padding: 1vw 1.1vw 0.9vw 1.1vw; display: flex; flex-direction: column; min-height: 0; overflow: hidden; cursor: pointer; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0.45vw; background: linear-gradient(var(--accent1), var(--accent2)); }
  .badge { position: absolute; top: 0.8vw; left: 1.1vw; width: 3vw; height: 3vw; border-radius: 50%; background: var(--red); color: #fff; border: 0.25vw solid var(--gold); font-family: Montserrat, sans-serif; font-weight: 800; font-size: 1.6vw; display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; display: flex; gap: 1vw; align-items: center; min-height: 0; overflow: hidden; padding-left: 3.6vw; }
  .body.has-img { padding-left: 3.6vw; padding-top: 0; gap: 0.8vw; }
  .pic { flex: 0 0 56%; height: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .q { flex: 1; max-height: 100%; font-size: 1.75vw; font-weight: 600; line-height: 1.25; }
  .body:not(.has-img) .q { font-size: 2vw; }
  .ans { margin-top: 0.6vw; border-radius: 0.7vw; padding: 0.45vw 0.9vw; min-height: 2.9vw; font-size: 1.8vw; font-weight: 800; color: var(--red); background: var(--gold-soft); border: 0.15vw dashed #d9b400; display: flex; align-items: center; gap: 0.6vw; max-height: 34%; overflow: hidden; flex-shrink: 0; line-height: 1.2; }
  .ans span { transition: opacity .3s, filter .3s; }
  .q-card:not(.shown) .ans span { opacity: 0; }
  .q-card:not(.shown) .ans { background: repeating-linear-gradient(45deg, #fff8d6 0 0.8vw, #fdf1b8 0.8vw 1.6vw); }
  .card.empty { background: transparent; border: 0.2vw dashed #d6cfb6; box-shadow: none; cursor: default; align-items: center; justify-content: center; color: #a39c86; font-size: 1.3vw; text-align: center; }
  .card.empty::before { display: none; }
  body.presenting .card.empty { visibility: hidden; }

  /* =================== Timer card =================== */
  .timer { background: var(--timer-bg); color: #fff; border: 0; cursor: default; align-items: center; justify-content: space-between; padding: 0.9vw; transition: background .4s; }
  .timer::before { background: linear-gradient(var(--gold), #d9a800); }
  .timer.done { background: var(--red); animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  .tlabel { font-family: Montserrat, sans-serif; font-weight: 700; font-size: 1vw; letter-spacing: .3em; color: var(--timer-label); text-transform: uppercase; }
  .ring { position: relative; flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .ring svg { height: 100%; max-height: 11vw; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.15); }
  .ring .prog { stroke: var(--ring); transition: stroke-dashoffset .25s linear, stroke .4s; }
  .timer.done .ring .prog { stroke: #fff; }
  .timer.done #tstate { font-size: 1.3vw; font-weight: 800; opacity: 1; color: var(--gold); }
  #tdisplay { position: absolute; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 3vw; font-variant-numeric: tabular-nums; }
  #tstate { font-size: 0.9vw; opacity: .8; position: absolute; margin-top: 5vw; }
  .presets { display: flex; gap: 0.4vw; width: 100%; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 2vw; }
  .presets button { flex: 1; font-size: 1.05vw; font-weight: 700; padding: 0.4vw 0; background: rgba(255,255,255,.12); color: #fff; }
  .presets button.on { background: var(--gold); color: var(--navy); }
  .controls { display: flex; gap: 0.4vw; width: 100%; margin-top: 0.4vw; }
  .controls button { font-size: 1.15vw; font-weight: 800; padding: 0.5vw 0; }
  #tstart { flex: 2; background: var(--start-bg); color: var(--start-fg); }
  #treset { flex: 1; background: rgba(255,255,255,.12); color: #fff; }

  /* =================== Kōwhaiwhai band =================== */
  .band { display: block; height: 2.4vw; width: calc(100% + 4.4vw); margin: 0 -2.2vw; border-top: 0.25vw solid var(--band-top); }
  .band .kb { fill: var(--band-bg); } .band .k1 { stroke: var(--band-k1); } .band .k2 { stroke: var(--band-k2); } .band .kd { fill: var(--band-k1); }

  /* =================== Edit-only controls =================== */
  #selectBtn { position: absolute; top: 1.2vw; right: 0; z-index: 5; font-size: 13px; padding: 7px 14px; background: var(--gold); color: var(--navy); font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  #hint { position: absolute; right: 0; top: 4.4vw; z-index: 5; font-size: 11px; font-weight: 700; color: var(--navy); background: #fff8d6; border: 1px solid var(--gold); border-radius: 6px; padding: 3px 8px; max-width: 200px; text-align: right; }
  body.presenting .edit-only { display: none !important; }

  /* =================== Picker (edit mode only, fixed px) =================== */
  #picker { position: fixed; inset: 0; background: var(--cream); z-index: 10; display: flex; flex-direction: column; font-size: 14px; }
  #picker[hidden] { display: none; }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--navy); color: #fff; border-bottom: 3px solid var(--gold); }
  .p-head h2 { font-family: Montserrat, sans-serif; font-size: 16px; margin: 0; flex: 1; color: var(--gold); }
  .p-head button { padding: 7px 14px; font-weight: 700; }
  #pSave { background: var(--gold); color: var(--navy); } #pSave:disabled { opacity: .5; cursor: default; }
  #pCancel { background: rgba(255,255,255,.15); color: #fff; }
  #pAdd { background: #2e9e5b; color: #fff; }
  .p-filter { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid #e6dfc8; background: #fff; }
  .p-filter select { font: inherit; padding: 4px 6px; border: 1px solid #d6cfb6; border-radius: 6px; }
  .p-filter small { color: #8a8470; }
  .qrow .by { font-size: 11px; color: #8a8470; margin-left: 6px; }
  #pCrumbs { padding: 8px 12px; border-bottom: 1px solid #e6dfc8; }
  #pCrumbs a { color: var(--blue); cursor: pointer; text-decoration: underline; font-weight: 600; }
  #pBody { flex: 1; overflow: auto; padding: 10px 12px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button { padding: 10px 18px; background: #fff; color: var(--navy); font-weight: 700; font-size: 14px; border: 2px solid var(--blue); }
  .choices button:hover { background: var(--blue); color: #fff; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { padding: 6px 14px; background: #fff; color: var(--navy); font-weight: 700; border: 2px solid #d6cfb6; }
  .tabs button.on { background: var(--red); border-color: var(--red); color: #fff; }
  .qrow { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-bottom: 1px solid #ece6d2; background: #fff; border-radius: 6px; margin-bottom: 4px; }
  .qrow input { margin-top: 3px; transform: scale(1.2); accent-color: var(--red); }
  .qrow .qa { color: var(--red); font-size: 12px; margin-top: 2px; font-weight: 700; }
  .qrow .tag { font-size: 11px; background: var(--gold-soft); padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
  .qrow.disabled { opacity: .45; }
  #pTray { border-top: 1px solid #e6dfc8; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 44px; background: #fff; }
  .chip { background: var(--navy); color: #fff; border-radius: 14px; padding: 4px 6px 4px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; max-width: 260px; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip button { background: var(--red); color: #fff; border-radius: 50%; width: 18px; height: 18px; padding: 0; font-size: 12px; line-height: 18px; }
  .msg { color: #8a8470; padding: 20px 0; }
  .err { color: var(--red); }
</style>
</head>

/* ---------------- Talking to the Google library ----------------
   Tries a normal request first; if PowerPoint's browser blocks it, falls back to
   loading it as a script (JSONP), which works almost everywhere. */
const LIB_BASE = LIBRARY_URL.trim().replace(/^['"\s]+|['"\s]+$/g, '').split('?')[0].split('#')[0];
function libJSONP(query) {
  return new Promise((resolve, reject) => {
    const cb = '__mt_cb_' + Date.now() + Math.floor(Math.random() * 1e6);
    const el = document.createElement('script');
    const done = () => { delete window[cb]; el.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error('the library took too long to answer')); }, 25000);
    window[cb] = data => { done(); resolve(data); };
    el.onerror = () => { done(); reject(new Error('the library address could not be reached')); };
    el.src = LIB_BASE + '?' + query + '&callback=' + cb;
    document.head.appendChild(el);
  });
}
async function libGet(query) {
  let data;
  try {
    const r = await fetch(LIB_BASE + '?' + query, { redirect: 'follow' });
    data = await r.json();
  } catch (e) {
    data = await libJSONP(query);           // backup route
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

/* Shrink long questions/answers so they always fit inside their card */
function fitText() {
  document.querySelectorAll('.q-card').forEach(card => {
    const body = card.querySelector('.body'), q = card.querySelector('.q'), ans = card.querySelector('.ans');
    q.style.fontSize = ''; ans.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(q).fontSize), n = 0;
    while ((body.scrollHeight > body.clientHeight + 1 || q.scrollHeight > q.clientHeight + 1) && n++ < 30 && fs > 8) {
      fs *= 0.93; q.style.fontSize = fs + 'px';
    }
    let fa = parseFloat(getComputedStyle(ans).fontSize); n = 0;
    while (ans.scrollHeight > ans.clientHeight + 1 && n++ < 30 && fa > 8) { fa *= 0.93; ans.style.fontSize = fa + 'px'; }
  });
}
let fitTimer = null;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitText, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitText());

        ${q.image ? `<div class="pic"><img src="${esc(q.image)}" alt=""></div>` : ''}
        <div class="q">${fmt(q.question)}</div>
      </div>
      <div class="ans"><span>${fmt(q.answer)}</span></div>
    </div>`);
  }
  // keep the timer element alive across re-renders so a running countdown isn't interrupted
  const existing = $('tcard');
  $('grid').innerHTML = cards.join('') + (existing ? '' : TIMER_HTML);
  if (existing) $('grid').appendChild(existing); else wireTimer();
  shownCount = 0;
  requestAnimationFrame(fitText);
}

/* Clicking anywhere on the slide (except the timer) works like a normal PowerPoint click:
   clicks 1–5 reveal the answers in order, the next click moves to the next slide.
   A presentation clicker / arrow keys do the same once the slide has been clicked. */
let shownCount = 0;
function showAnswers() {
  $('grid').querySelectorAll('.q-card').forEach((c, i) => c.classList.toggle('shown', i < shownCount));
}
function goToSlide(which, fallback) {
  if (inOffice && mode === 'read') {
    Office.context.document.goToByIdAsync(which, Office.GoToType.Index, r => {
      if (r.status === Office.AsyncResultStatus.Failed) fallback();
      else { shownCount = 0; showAnswers(); }   // reset, so answers are hidden if you come back
    });
  } else fallback();
}
function stepForward() {
  const n = $('grid').querySelectorAll('.q-card').length;
  if (shownCount < n) { shownCount++; showAnswers(); }
  else goToSlide('next', () => { shownCount = 0; showAnswers(); });  // edit view / browser: hide all instead
}
function stepBack() {
  if (shownCount > 0) { shownCount--; showAnswers(); }
  else goToSlide('previous', () => {});
}
$('app').addEventListener('click', e => {
  grabFocus();
  if (e.target.closest('#tcard, #selectBtn, #hint, #picker')) return;
  stepForward();
});
// Keyboard only reaches the add-in while it has focus, so take focus whenever possible
function grabFocus() { try { window.focus(); $('app').focus({ preventScroll: true }); } catch (e) {} }
document.addEventListener('mousedown', grabFocus, true);
window.addEventListener('keydown', e => {
  if (!$('picker').hidden) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n', 'N'].includes(e.key)) { e.preventDefault(); stepForward(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(e.key)) { e.preventDefault(); stepBack(); }
});

/* ---------------- Timer ---------------- */
let total = 300, remaining = 300, running = false, endAt = 0, tick = null, actx = null;
const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function renderTimer(label) {
  $('tdisplay').textContent = mmss(remaining);
  if (label) $('tstate').textContent = label;
  $('tring').style.strokeDashoffset = RING_C * (1 - remaining / total);
  $('tstart').textContent = running ? 'Pause' : (remaining < total && remaining > 0 ? 'Resume' : 'Start');
  document.querySelectorAll('.presets button').forEach(b => b.classList.toggle('on', +b.dataset.min === total / 60));
}
function setMinutes(m, persist) {
  stopTick(); total = m * 60; remaining = total;
  $('tcard').classList.remove('done'); renderTimer('Ready');
  if (persist && mode === 'edit' && state.minutes !== m) { state.minutes = m; store.save(state).catch(() => {}); }
}
function stopTick() { clearInterval(tick); tick = null; running = false; }
function update() {
  remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  if (remaining <= 0) { stopTick(); $('tcard').classList.add('done'); renderTimer('Kua pau te wā! · Time’s up'); chime(); return; }
  renderTimer();
}
function wireTimer() {
  $('tstart').addEventListener('click', () => {
    unlockAudio();
    if (running) { update(); stopTick(); renderTimer('Paused'); return; }
    if (remaining <= 0) remaining = total;
    endAt = Date.now() + remaining * 1000; running = true;
    $('tcard').classList.remove('done'); renderTimer('Counting down');
    tick = setInterval(update, 250);
  });
  $('treset').addEventListener('click', () => setMinutes(total / 60, false));
  document.querySelectorAll('.presets button').forEach(b => b.addEventListener('click', () => { unlockAudio(); setMinutes(+b.dataset.min, true); }));
}
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function chime() {
  if (!actx) return;
  const t0 = actx.currentTime + 0.05;
  [0, 0.3, 0.6, 1.4, 1.7, 2.0].forEach((d, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = (i % 3 === 2) ? 1046.5 : 880;
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.6, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.28);
    o.connect(g); g.connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + 0.3);
  });
}

/* ---------------- Edit vs slideshow ---------------- */
function applyView(v) {
  mode = v === 'read' ? 'read' : 'edit';
  if (mode === 'read') grabFocus();
  document.body.classList.toggle('presenting', mode === 'read');
  if (mode === 'read') $('picker').hidden = true;
}

/* ---------------- Picker ---------------- */
let lib = null, path = {}, diff = 'Easy', picked = [];

async function openPicker() {
  picked = state.questions.map(q => ({ ...q }));
  path = {}; diff = 'Easy';
  $('picker').hidden = false;
  {
    $('pBody').innerHTML = '<div class="msg">Loading question library…</div>';
    try {
      if (!LIBRARY_URL) lib = DEMO.map(q => ({ ...q, author: q.author || 'FDMC library' }));
      else {
        const j = await libGet('action=list');
        lib = j.questions;
        lib.forEach(q => { q.author = q.author || 'FDMC library'; });
      }
    } catch (e) {
      $('pBody').innerHTML = `<div class="msg err">Couldn’t load the library: ${esc(e.message)}<br>Check the internet connection and the LIBRARY_URL setting.<br><small>Address used: ${esc(LIB_BASE.slice(0, 45))}…${esc(LIB_BASE.slice(-12))}</small></div>`;
      renderTray(); return;
    }
  }
  fillAuthors();
  renderPicker();
}

/* ---------- "Added by" filter ---------- */
const BY_KEY = 'mahiTimatanga.addedBy';
let byFilter = (() => { try { return localStorage.getItem(BY_KEY) || ''; } catch (e) { return ''; } })();
function fillAuthors() {
  const authors = uniq(lib.map(q => q.author)).sort((a, b) => (a === 'FDMC library' ? -1 : b === 'FDMC library' ? 1 : a.localeCompare(b)));
  if (byFilter && !authors.includes(byFilter)) byFilter = '';
  $('pBy').innerHTML = '<option value="">Everyone</option>' + authors.map(a => `<option ${a === byFilter ? 'selected' : ''}>${esc(a)}</option>`).join('');
}
$('pBy').addEventListener('change', () => {
  byFilter = $('pBy').value;
  try { localStorage.setItem(BY_KEY, byFilter); } catch (e) {}
  path = {}; renderPicker();
});
const pool = () => byFilter ? lib.filter(q => q.author === byFilter) : lib;

/* ---------- "Add a question" opens the Google Form ---------- */
let formUrl = null;
$('pAdd').addEventListener('click', async () => {
  try {
    if (!formUrl) {
      if (!LIBRARY_URL) throw new Error('Connect the library first (LIBRARY_URL).');
      formUrl = (await libGet('action=config')).formUrl;
      if (!formUrl) throw new Error('The form has not been set up yet (run setupForm in Apps Script).');
    }
    if (window.Office && Office.context && Office.context.ui && Office.context.ui.openBrowserWindow) Office.context.ui.openBrowserWindow(formUrl);
    else window.open(formUrl, '_blank');
    $('pBody').insertAdjacentHTML('afterbegin', '<div class="msg">The form has opened in your browser. After adding a question, close and reopen this window to see it.</div>');
  } catch (e) {
    $('pBody').insertAdjacentHTML('afterbegin', `<div class="msg err">${esc(e.message || e)}</div>`);
  }
});

function renderPicker() {
  const c = ['<a data-lvl="0">All years</a>'];
  if (path.year) c.push(`<a data-lvl="1">Year ${esc(path.year)}</a>`);
  if (path.unit) c.push(`<a data-lvl="2">${esc(path.unit)}</a>`);
  if (path.topic) c.push(`<b>${esc(path.topic)}</b>`);
  $('pCrumbs').innerHTML = c.join(' › ');
  $('pCrumbs').querySelectorAll('a').forEach(a => a.onclick = () => {
    const l = +a.dataset.lvl;
    if (l < 1) delete path.year; if (l < 2) delete path.unit; delete path.topic;
    renderPicker();
  });

  const body = $('pBody');
  const choose = (items, key, prefix = '') => {
    body.innerHTML = items.length
      ? `<div class="choices">${items.map(v => `<button data-v="${esc(v)}">${prefix}${esc(v)}</button>`).join('')}</div>`
      : '<div class="msg">Nothing here yet.</div>';
    body.querySelectorAll('button').forEach(b => b.onclick = () => {
      path[key] = b.dataset.v;
      if (key === 'topic') diff = 'Easy';
      renderPicker();
    });
  };

  if (!path.year) choose(uniq(pool().map(q => q.year)).sort((a, b) => parseFloat(a) - parseFloat(b) || String(a).localeCompare(b)), 'year', 'Year ');
  else if (!path.unit) choose(uniq(pool().filter(q => q.year == path.year).map(q => q.unit)), 'unit');
  else if (!path.topic) choose(uniq(pool().filter(q => q.year == path.year && q.unit == path.unit).map(q => q.topic)), 'topic');
  else {
    const inTopic = pool().filter(q => q.year == path.year && q.unit == path.unit && q.topic == path.topic);
    const tabs = DIFFS.map(d => `<button data-d="${d}" class="${d === diff ? 'on' : ''}">${d} (${inTopic.filter(q => q.difficulty == d).length})</button>`).join('');
    const qs = inTopic.filter(q => q.difficulty == diff);
    const full = picked.length >= MAX_Q;
    body.innerHTML = `<div class="tabs">${tabs}</div>` + (qs.length ? qs.map(q => {
      const on = picked.some(p => p.id === q.id);
      return `<label class="qrow ${!on && full ? 'disabled' : ''}"><input type="checkbox" data-id="${esc(q.id)}" ${on ? 'checked' : ''} ${!on && full ? 'disabled' : ''}>
        <div><div>${fmt(q.question)}${q.image ? '<span class="tag">image</span>' : ''}</div><div class="qa">Answer: ${fmt(q.answer)}${q.author && q.author !== 'FDMC library' ? `<span class="by">added by ${esc(q.author)}</span>` : ''}</div></div></label>`;
    }).join('') : '<div class="msg">No questions at this level yet.</div>');
    body.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { diff = b.dataset.d; renderPicker(); });
    body.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
      const q = lib.find(x => x.id === cb.dataset.id);
      if (cb.checked) { if (picked.length < MAX_Q) picked.push({ ...q }); }
      else picked = picked.filter(p => p.id !== q.id);
      renderPicker();
    });
  }
  renderTray();
}

function renderTray() {
  $('pCount').textContent = `(${picked.length}/${MAX_Q})`;
  $('pSave').disabled = picked.length === 0;
  $('pTray').innerHTML = picked.length
    ? picked.map((q, i) => `<span class="chip"><span>${i + 1}. ${esc(q.question)}</span><button data-id="${esc(q.id)}" title="Remove">×</button></span>`).join('')
    : '<span class="msg" style="padding:0">Tick up to 5 questions. You can pick from different topics.</span>';
  $('pTray').querySelectorAll('button').forEach(b => b.onclick = () => { picked = picked.filter(p => p.id !== b.dataset.id); lib ? renderPicker() : renderTray(); });
}

/* Teachers' photos can be several MB – shrink to max 800 px before saving into the slide */
function shrinkImage(dataUrl, max = 800) {
  return new Promise(resolve => {
    if (!dataUrl || dataUrl.startsWith('data:image/svg')) return resolve(dataUrl);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && dataUrl.length < 400000) return resolve(dataUrl);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const png = c.toDataURL('image/png'), jpg = c.toDataURL('image/jpeg', 0.85);
      resolve(png.length <= jpg.length * 1.3 ? png : jpg);   // keep PNG for diagrams, JPEG for photos
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function savePicker() {
  $('pSave').disabled = true; $('pSave').textContent = 'Saving…';
  try {
    const need = picked.filter(q => q.image && !String(q.image).startsWith('data:'));
    if (need.length && LIBRARY_URL) {
      const j = await libGet('action=images&ids=' + encodeURIComponent(need.map(q => q.id).join(',')));
      for (const q of need) q.image = await shrinkImage((j.images && j.images[q.id]) || '');
    }
    state.questions = picked.map(q => ({ id: q.id, question: q.question, answer: q.answer, image: q.image || '' }));
    await store.save(state);
    $('picker').hidden = true;
    renderGrid();
  } catch (e) {
    $('pBody').insertAdjacentHTML('afterbegin', `<div class="msg err">Couldn’t save: ${esc(e.message || e)}</div>`);
  } finally {
    $('pSave').textContent = 'Save to this slide'; $('pSave').disabled = picked.length === 0;
  }
}

$('selectBtn').addEventListener('click', openPicker);
$('pCancel').addEventListener('click', () => { $('picker').hidden = true; });
$('pSave').addEventListener('click', savePicker);

/* ---------------- Start-up ---------------- */
function boot() {
  const saved = store.load();
  if (saved && saved.questions) state = { questions: saved.questions, minutes: saved.minutes || 5 };
  renderGrid();
  setMinutes(state.minutes, false);
}

if (typeof Office !== 'undefined' && Office.onReady) {
  Office.onReady(info => {
    inOffice = !!(info && info.host);
    boot();
    if (inOffice) {
      const doc = Office.context.document;
      try { doc.getActiveViewAsync(r => { if (r.status === Office.AsyncResultStatus.Succeeded) applyView(r.value); }); } catch (e) {}
      try { doc.addHandlerAsync(Office.EventType.ActiveViewChanged, e => applyView(e.activeView)); } catch (e) {}
    }
  });
} else {
  boot();
}
</script>
